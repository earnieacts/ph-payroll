name: publish

# Publishes when the version in package.json changes on main.
#
# NOT on every merge: the second merge would fail, because a version can only be
# published once. Bumping the version is therefore the deliberate act that
# triggers a release, and a README fix merges quietly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release tag
  id-token: write # OIDC for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          #
          # Do NOT pin 22.14.0 exactly. npm@latest is now npm 12, which requires
          # node ^22.22.2 || ^24.15.0 || >=26.0.0, so installing it on 22.14.0
          # fails with EBADENGINE. '24' resolves to the newest 24.x, which
          # satisfies both constraints.
          node-version: '24'
          cache: pnpm
          # NO registry-url here, deliberately.
          #
          # `registry-url` makes setup-node write an .npmrc containing
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With no
          # NPM_TOKEN secret that resolves to a placeholder, and npm then sends
          # that garbage token instead of falling back to OIDC — so trusted
          # publishing is never attempted at all. The symptom is a bare 404 with
          # no mention of OIDC anywhere in the log.
          #
          # Trusted publishing needs NO token, so it needs no .npmrc.

      - name: upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          # If an auth token is configured, npm uses it and silently skips OIDC,
          # surfacing later as a bare 404 with no mention of trusted publishing.
          # Fail here instead, where the cause is obvious.
          TOKEN="$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || echo undefined)"
          if [ "$TOKEN" != "undefined" ] && [ -n "$TOKEN" ]; then
            echo "::error::An npm auth token is configured, so OIDC will be skipped. Remove registry-url from setup-node."
            exit 1
          fi
          echo "No auth token configured - OIDC will be used." 

      - run: pnpm install --frozen-lockfile

      - name: has the version changed?
        id: check
        run: |
          LOCAL="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          # A never-published package 404s here; that is a publish, not a failure.
          REMOTE="$(npm view "$NAME" version 2>/dev/null || echo 'none')"
          echo "local=$LOCAL  remote=$REMOTE"
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL is already on npm. Nothing to do."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly re-runs clean + typecheck + test + build, so a broken
      # build cannot reach the registry even if CI were somehow skipped.
      - name: publish
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public

      # Idempotent on purpose. `npm version` creates the tag locally, so whether
      # it already exists on origin depends on whether you pushed with
      # --follow-tags. Both must work: the alternative is a red run for a release
      # that actually succeeded, which teaches you to ignore red runs.
      - name: tag the release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already on origin (pushed with --follow-tags). Leaving it."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to do."
          else
            # Notes carry the supported-period floor, read live from the code
            # rather than retyped, so release notes cannot drift from behaviour.
            FLOOR="$(node --input-type=module -e "
              import { coverage } from './dist/index.js';
              process.stdout.write(coverage().fullySupportedFrom);
            ")"

            {
              echo "Published to npm as \`ph-payroll@$VERSION\`."
              echo
              echo '```bash'
              echo "npm install ph-payroll@$VERSION"
              echo '```'
              echo
              echo "### Supported periods"
              echo
              echo "\`computePayroll\` supports **$FLOOR onward**. Earlier periods throw"
              echo "\`NoRuleError\` rather than approximating, because rules are encoded only"
              echo "from the circular that introduced them."
              echo
              echo "Check with \`coverage()\` or \`isPeriodSupported(period)\` before computing."
              echo
              echo "See CHANGELOG.md for the full entry."
            } > /tmp/notes.md

            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
          fi
