name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Full suite, on the Node versions the DEV toolchain supports.
  # vitest 4 requires ^20 || ^22 || >=24, so Node 18 cannot run the tests even
  # though the published library supports it. That claim is tested in `compat`.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Pack the real tarball, so `compat` tests what a consumer installs:
      # package.json, the exports map and all. An earlier version uploaded bare
      # dist/, which has no package.json, so Node had nothing declaring
      # "type": "module" — Node 22+ auto-detects ESM syntax and passed, Node 18
      # does not and failed. The test was artificial; this one is not.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: tarball
          path: ph-payroll-*.tgz
          retention-days: 1

  # Proves `engines: >=18` by installing the packed tarball and running it.
  # A declared floor that is never exercised is a floor that is wrong.
  compat:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install the packed tarball as a consumer would
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/ph-payroll-*.tgz
          node --version

      - name: the installed package imports and computes
        working-directory: /tmp/consumer
        run: |
          node --input-type=module -e "
            import { computePayroll, monthlySalaryCredit, parseDecimal, formatFixed, NoRuleError }
              from 'ph-payroll';

            const r = computePayroll({ monthlyBasic: '25000', period: '2026-03' });
            const checks = [
              ['netPay', r.netPay, '22611.25'],
              ['sss.employee', r.contributions.sss.employee, '1250.00'],
              ['sss.msc', r.contributions.sss.msc, '25000.00'],
              ['withholdingTax', r.withholdingTax, '313.75'],
              // The bracket edge: one centavo more lands on MSC 15,000.
              ['msc(14749.99)', formatFixed(monthlySalaryCredit(parseDecimal('14749.99'), '2026-03'), 2), '14500.00'],
            ];
            let failed = false;
            for (const [name, got, want] of checks) {
              if (got !== want) { console.error('FAIL ' + name + ': got ' + got + ', want ' + want); failed = true; }
            }
            try {
              computePayroll({ monthlyBasic: '25000', period: '2023-06' });
              console.error('FAIL: an unencoded period should throw'); failed = true;
            } catch (e) {
              if (!(e instanceof NoRuleError)) { console.error('FAIL: wrong error ' + e.name); failed = true; }
            }
            if (failed) process.exit(1);
            console.log('ok on node ' + process.version);
          "
